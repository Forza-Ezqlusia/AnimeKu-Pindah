<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeKu pindah ke Nexanime</title>
<meta name="description" content="AnimeKu sekarang bernama Nexanime dan pindah ke nexanime.web.id.">
<link rel="canonical" href="https://nexanime.web.id/">
<noscript><meta http-equiv="refresh" content="10;url=https://nexanime.web.id/"></noscript>
<style>
:root{--bg:#f6f4f7;--fg:#1c1b1f;--mut:#6b6670;--ac:#c4002f;--card:#ffffff;--bd:#e4e0e8}
@media (prefers-color-scheme:dark){:root{--bg:#0f0e12;--fg:#f1eff3;--mut:#9a95a1;--card:#18161d;--bd:#2a2631}}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
.card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px 26px;text-align:center;box-sizing:border-box}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac);border-radius:999px;padding:4px 12px;margin-bottom:16px}
h1{font-size:26px;line-height:1.25;margin:0 0 12px}
h1 span{color:var(--ac)}
p{color:var(--mut);line-height:1.55;margin:0 0 14px;font-size:15px}
.old{text-decoration:line-through}
.url{display:block;font-weight:700;color:var(--fg);font-size:17px;margin:4px 0 20px;word-break:break-all}
.btn{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;padding:12px 24px;border-radius:10px;font-weight:600;font-size:15px}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.count{margin:18px 0 0;font-size:14px;color:var(--mut)}
.count b{color:var(--fg)}
.stay{background:none;border:0;padding:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<main class="card">
  <div class="badge">Pengumuman</div>
  <h1><span class="old">AnimeKu</span> sekarang <span>Nexanime</span></h1>
  <p>Nama dan alamat situs kami sudah berganti. Katalog, jadwal, dan semua fitur tetap sama, hanya pindah rumah.</p>
  <p>Alamat baru:</p>
  <a class="url" href="https://nexanime.web.id/">nexanime.web.id</a>
  <a class="btn" id="go" href="https://nexanime.web.id/">Buka Nexanime</a>
  <p class="count" id="count" aria-live="polite">Anda akan dialihkan otomatis dalam <b id="sec">10</b> detik.</p>
  <button class="stay" id="stay" type="button">Tetap di halaman ini</button>
  <noscript><p class="count">Aktifkan JavaScript untuk pengalihan otomatis, atau klik tombol di atas.</p></noscript>
</main>
<script>
(function(){
  var TARGET="https://nexanime.web.id/", left=10, timer=null;
  var sec=document.getElementById("sec"), count=document.getElementById("count"), stay=document.getElementById("stay");
  function tick(){
    left--;
    if(left<=0){clearInterval(timer);location.replace(TARGET);return;}
    sec.textContent=left;
  }
  timer=setInterval(tick,1000);
  stay.addEventListener("click",function(){
    clearInterval(timer);
    count.textContent="Pengalihan otomatis dibatalkan. Klik tombol di atas kapan saja untuk pindah.";
    stay.style.display="none";
  });
})();
</script>
</body>
</html>
